<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password – ExpenseFlow</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
          <div class="brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <span>ExpenseFlow</span>
        </a>
        <h2 class="auth-title">Reset Password</h2>
        <p class="auth-subtitle">Enter your registered email address to receive reset instructions</p>
      </div>

      <form id="forgot-form">
        <div class="form-group">
          <label for="forgot-email">Email Address</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="alex.smith@example.com" required>
        </div>

        <button type="submit" id="forgot-submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          Send Password Reset Email
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password? <a href="login.html">Back to Sign In</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('forgot-form');
      const submitBtn = document.getElementById('forgot-submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value;

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Sending Instructions...';

          await resetPasswordRequest(email);
          showToast('Password reset link sent! Check your email inbox.', 'success', 5000);
          
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 2000);
        } catch (err) {
          showToast(err.message || 'Failed to send reset email.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Send Password Reset Email';
        }
      });
    });
  </script>
</body>
</html>
