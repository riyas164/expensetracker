<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up – ExpenseFlow</title>

  <!-- Google Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="brand-logo" style="justify-content: center; margin-bottom: 12px;">
          <div class="brand-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          </div>
          <span>ExpenseFlow</span>
        </a>
        <h2 class="auth-title">Create an Account</h2>
        <p class="auth-subtitle">Start tracking your personal expenses in seconds</p>
      </div>

      <form id="signup-form">
        <div class="form-group">
          <label for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="form-control" placeholder="Alex Smith" required>
        </div>

        <div class="form-group">
          <label for="signup-email">Email Address</label>
          <input type="email" id="signup-email" class="form-control" placeholder="alex.smith@example.com" required>
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" class="form-control" placeholder="At least 6 characters" required minlength="6">
        </div>

        <div class="form-group">
          <label for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" class="form-control" placeholder="Re-enter password" required minlength="6">
        </div>

        <button type="submit" id="signup-submit-btn" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px;">
          Create Free Account
        </button>

        <div style="display: flex; align-items: center; margin: 16px 0; gap: 10px;">
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
          <span style="font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;">OR EXPLORE DEMO</span>
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></div>
        </div>

        <button type="button" id="demo-signup-btn" class="btn btn-secondary" style="width: 100%; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Instant Demo Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Log In</a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/utils.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Redirect if already logged in
      await initAuthCheck('guest');

      const form = document.getElementById('signup-form');
      const submitBtn = document.getElementById('signup-submit-btn');
      const demoBtn = document.getElementById('demo-signup-btn');

      if (demoBtn) {
        demoBtn.addEventListener('click', async () => {
          try {
            demoBtn.disabled = true;
            demoBtn.textContent = 'Launching Demo...';
            await loginDemoUser('demo@expenseflow.app', 'Demo User');
            showToast('Logged in as Demo User!', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 600);
          } catch(e) {
            showToast('Error entering Demo mode', 'error');
            demoBtn.disabled = false;
          }
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fullName = document.getElementById('signup-name').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-confirm-password').value;

        if (password !== confirmPassword) {
          showToast('Passwords do not match.', 'error');
          return;
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Creating Account...';

          const result = await signUpUser(fullName, email, password);
          if (result && result.requiresConfirmation) {
            showToast('Registration successful! Please check your email inbox to verify your account before logging in.', 'success', 6000);
            submitBtn.textContent = 'Verification Email Sent';
            setTimeout(() => {
              window.location.href = 'login.html';
            }, 3000);
          } else {
            showToast('Registration successful! Redirecting to Dashboard...', 'success');
            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 600);
          }
        } catch (err) {
          showToast(err.message || 'Failed to create account.', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Free Account';
        }
      });
    });
  </script>
</body>
</html>
